<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ROCK PAPPER SCISSORS</h1>
    <div class="choice">
        <div class="choice-item" id="paper">
            <img src="image/paper.png" alt="">
        </div>
        <div class="choice-item" id="rock">
            <img src="image/rock.png" alt="">
        </div>
        <div class="choice-item" id="scissor">
            <img src="image/scissors.png" alt="">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="com">0</p>
            <p>Computer</p>
        </div>
    </div>
    <div class="message-container">
        <p id="message">Play the game</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
